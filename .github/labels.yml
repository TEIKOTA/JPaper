# gh label を使って一括適用できる汎用ラベル定義。
# 例: gh label create "kind:bug" --color d73a4a --description "..."（または同期ツール）
- name: "kind:feature"
  color: "a2eeef"
  description: "新機能・改善"
- name: "kind:bug"
  color: "d73a4a"
  description: "既存挙動が壊れている"
- name: "kind:docs"
  color: "0075ca"
  description: "ドキュメント"
- name: "kind:tech-debt"
  color: "7057ff"
  description: "リファクタ・保守性・内部品質"
- name: "kind:ux"
  color: "bfdadc"
  description: "使い勝手・文言・導線・視認性"

- name: "priority:p1"
  color: "d93f0b"
  description: "優先度 高"
- name: "priority:p2"
  color: "fbca04"
  description: "優先度 中"
- name: "priority:p3"
  color: "0e8a16"
  description: "優先度 低・後回し可"

- name: "authority:code"
  color: "ededed"
  description: "コードとテストだけで閉じる"
- name: "authority:spec"
  color: "f9d0c4"
  description: "仕様 / 契約の更新が必要"
- name: "authority:adr"
  color: "e99695"
  description: "repo-wide な architecture / process / security 判断を含む"
