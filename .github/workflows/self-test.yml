# scripts/ の検査スクリプト群の self-test。macOS(bash 3.2) / Linux の両方で退行を検出する。
name: self-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # pr-checks と異なり、変更されたスクリプト自体を試験するのが目的なので PR head を checkout する。
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # GitHub の macOS の runner には lefthook が無く、lefthook を使う test が skip される。macOS では
      # skip 0 件が条件（tests/run-tests.sh）なので、self-test の前に入れる。版は docker/agent/Dockerfile の
      # LEFTHOOK_VERSION と同じに固定する（ホストで検証した版。Homebrew は版を固定できず runner image で揺れる）。
      # 上げるときは Dockerfile の ARG と同時に変える。
      - name: lefthook を入れる（macOS）
        if: runner.os == 'macOS'
        env:
          LEFTHOOK_VERSION: 2.1.9
        run: |
          npm install -g "lefthook@${LEFTHOOK_VERSION}"
          lefthook version
      - name: self-test を実行
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # /bin/bash は 3.2。テンプレの bash 3.2 互換を実証する
            /bin/bash tests/run-tests.sh
          else
            bash tests/run-tests.sh
          fi
